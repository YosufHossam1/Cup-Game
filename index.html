<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <div class="fullPage">
    <div class="levels">
      <p id="stats">Choice Your Level . . .</p>
      <div class="level" data-level="600">Easy</div>
      <div class="level" data-level="400">Medium</div>
      <div class="level" data-level="100">Hard</div>
    </div>
    <div class="rightSection">
      <div class="stats">ready ?</div>
      <div class="container">
        <div class="cup one">
          <img class="" src="images/cup.png" alt="">
        </div>
        <div class="cup two">
          <img class="special" src="images/cup.png" alt="">
          <div class="boll"></div>
        </div>
        <div class="cup three">
          <img class="" src="images/cup.png" alt="">
        </div>
      </div>
      <button type="button">Start Game</button>
    </div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="main.js"></script>
</body>

</html>
